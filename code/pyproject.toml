[project]
name = "sports-ai"
version = "0.1.0"
description = "Sports AI Betting Research System - V1 skeleton"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
ml = [
    "scikit-learn>=1.4",
    "pandas>=2.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
