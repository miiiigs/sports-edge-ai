name: Football Stabilization

on:
  pull_request:
    paths:
      - "code/**"
      - "Dockerfile"
      - ".github/workflows/football-stabilization.yml"

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: code/pyproject.toml
      - name: Install focused test dependencies
        run: python -m pip install -e "./code[api,dev]"
      - name: Run auth and runtime-isolation gates
        env:
          PYTHONPATH: code/src
        run: >-
          python -m pytest
          code/tests/test_football_auth.py
          code/tests/test_football_owner_access.py
          code/tests/test_dashboard_runtime_isolation.py
          -q
