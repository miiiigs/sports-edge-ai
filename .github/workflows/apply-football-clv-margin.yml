name: Apply Football CLV Margin Fix

on:
  push:
    branches: [fix/football-clv-closing-margin]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SPORTS_AI_ALLOW_PAID_PROVIDER_CALLS: "0"
      SPORTS_AI_CURRENT_ODDS_CONNECTED: "0"
      SPORTS_AI_ENABLE_ODDS_SYNC: "0"
      SPORTS_AI_CURRENT_XG_CONNECTED: "0"
      SPORTS_AI_AUTH_ENABLED: "0"
      SPORTS_AI_API_FOOTBALL_LEAGUE_MAP: research/manual_inputs/api_football_league_map.json
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/football-clv-closing-margin
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./code[api,dev,ml]"

      - name: Apply audited patch
        run: python .github/scripts/apply_football_clv_margin_patch.py

      - name: Compile production package
        run: python -m compileall -q code/src/sports_ai

      - name: Run focused CLV regression tests
        run: >-
          pytest -q
          code/tests/test_football_clv_margin.py
          code/tests/test_football_intelligence.py
          code/tests/test_football_paper_trading.py

      - name: Commit verified patch and remove one-off tooling
        run: |
          rm .github/workflows/apply-football-clv-margin.yml
          rm .github/scripts/apply_football_clv_margin_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Football closing-margin CLV persistence"
          git push origin HEAD:fix/football-clv-closing-margin
