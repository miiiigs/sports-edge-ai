name: Football Production Wake

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-production-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Railway and verify health
        shell: bash
        run: |
          curl             --fail             --silent             --show-error             --location             --retry 2             --retry-delay 5             --max-time 90             "https://sports-edge-ai-production.up.railway.app/health"
