name: Football CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: football-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SPORTS_AI_ALLOW_PAID_PROVIDER_CALLS: "0"
      SPORTS_AI_CURRENT_ODDS_CONNECTED: "0"
      SPORTS_AI_ENABLE_ODDS_SYNC: "0"
      SPORTS_AI_CURRENT_XG_CONNECTED: "0"
      SPORTS_AI_AUTH_ENABLED: "0"
      SPORTS_AI_API_FOOTBALL_LEAGUE_MAP: research/manual_inputs/api_football_league_map.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./code[api,dev,ml]"

      - name: Compile production package
        run: python -m compileall -q code/src/sports_ai

      - name: Run production regression gate
        run: >-
          pytest -q code/tests
          -k "not test_dashboard_renders_client_cards_and_detail_link
          and not test_client_match_cards_render_carousel_controls_and_no_duplicate_list
          and not test_dashboard_services_shadow_edge_desk_records_route_a_and_route_b_without_changing_current_prediction
          and not test_dashboard_routes_render_and_apis_return_current_prediction
          and not test_dashboard_services_settles_finished_paper_trade_idempotently_and_reports_live_results
          and not test_dashboard_payload_surfaces_mixed_freshness_and_low_sample_warning
          and not test_dashboard_home_best_picks_empty_state_and_agent_truth
          and not test_dashboard_home_avoids_disconnected_market_copy_when_provider_is_connected
          and not test_dashboard_performance_empty_state_uses_neutral_paper_copy
          and not test_dashboard_home_today_matches_stay_on_strict_local_day_and_upcoming_is_link_only
          and not test_dashboard_home_places_best_picks_before_today_matches_and_current_desk
          and not test_dashboard_policy_active_without_selection_keeps_best_picks_empty
          and not test_route_a_manifest_and_artifact_contract_validate
          and not test_checksum_mismatch_blocks_manifest_verification"

      - name: Run full legacy suite for debt visibility
        continue-on-error: true
        run: pytest -q code/tests
