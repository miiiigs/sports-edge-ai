name: Football CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: football-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SPORTS_AI_ALLOW_PAID_PROVIDER_CALLS: "0"
      SPORTS_AI_CURRENT_ODDS_CONNECTED: "0"
      SPORTS_AI_ENABLE_ODDS_SYNC: "0"
      SPORTS_AI_CURRENT_XG_CONNECTED: "0"
      SPORTS_AI_AUTH_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./code[api,dev,ml]"

      - name: Compile production package
        run: python -m compileall -q code/src/sports_ai

      - name: Run Football regression suite
        run: pytest -q code/tests
